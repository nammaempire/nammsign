name: signage_app
description: Digital Signage Advertising Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # HTTP & API
  http: ^1.2.1

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0

  # Authentication
  google_sign_in: ^6.2.1

  # Media
  image_picker: ^1.1.2
  video_player: ^2.8.7
  file_picker: ^8.0.3
  cached_network_image: ^3.3.1

  # Payment
  razorpay_flutter: ^1.3.6

  # Storage & Prefs
  shared_preferences: ^2.2.3

  # UI & Utils
  flutter_svg: ^2.0.10+1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  dotted_border: ^2.1.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
